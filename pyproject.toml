[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamt-wearable-sleep-staging"
version = "0.1.0"
description = "Wearable-based sleep stage classification using the DREAMT dataset."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn>=1.8",
    "matplotlib",
    "seaborn",
    "jupyter",
    "ipykernel",
    "torch",
    "tqdm",
    "xgboost",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "notebooks"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
